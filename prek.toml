[[repos]]
repo = "local"

[[repos.hooks]]
id = "openspec-archived-tasks"
name = "OpenSpec archived tasks"
entry = "bunx --no-install openspec validate --archived --no-interactive"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "actionlint"
name = "actionlint"
entry = "bunx --no-install github-actionlint"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-commit"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "biome-format"
name = "biome format + organize imports"
entry = "bunx --no-install @biomejs/biome check --write"
language = "system"
types_or = ["ts", "json"]
pass_filenames = true

[[repos.hooks]]
id = "biome-lint"
name = "biome lint"
entry = "bunx --no-install @biomejs/biome lint"
language = "system"
types = ["ts"]
pass_filenames = true

# CI parity backstop. The pre-commit biome hook is fast and per-file; this one
# runs the exact gate CI enforces (`bun run check` = `biome check .`, i.e.
# formatter + linter + organizeImports over the whole repo) so a commit that
# bypassed the pre-commit stage cannot reach a red CI. `pass_filenames` is off
# on purpose: `biome check .` is repo-wide, and passing a file list would
# silently narrow it back to a subset.
[[repos.hooks]]
id = "biome-check-prepush"
name = "biome check (repo-wide, CI parity)"
entry = "bun run check"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-push"]

[[repos.hooks]]
id = "commitlint"
name = "commitlint (conventional commits)"
entry = "commitlint --edit"
language = "bun"
additional_dependencies = ["@commitlint/cli@^21.2.2", "@commitlint/config-conventional@^21"]
stages = ["commit-msg"]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"

[[repos.hooks]]
id = "gitleaks"

name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      # Consume the package scripts rather than repeating their commands here:
      # one definition per gate, so `bun run <script>` locally is byte-identical
      # to what CI enforces (see the format:check/lint gap).
      - run: bun run typecheck
      - run: bun run check
      - run: bun run test
